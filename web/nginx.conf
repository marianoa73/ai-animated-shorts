server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self'; frame-ancestors 'none'; connect-src 'self'" always;
    location = / { try_files /index.html =404; }
    location = /index.html { }
    location = /listing/ { alias /media/; autoindex on; autoindex_format json; }
    location ~ ^/media/([a-z0-9][a-z0-9-]*\.(mp4|jpg|png|json))$ { alias /media/$1; add_header Cache-Control no-store; }
    location / { return 404; }
}
