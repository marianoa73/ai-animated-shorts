<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Revisión local · Animated Shorts</title>
<style>:root{color-scheme:dark}body{margin:auto;padding:24px;max-width:1100px;background:#0F1115;color:#edf0f4;font:16px/1.5 system-ui}h1{font-size:1.8rem}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,a{color:inherit}button{min-height:44px;padding:10px 18px;border:1px solid #606978;border-radius:8px;background:#202630;cursor:pointer}button[aria-pressed=true]{background:#FD5A02;color:#0F1115;border-color:#FD5A02;font-weight:bold}button:focus-visible,a:focus-visible{outline:3px solid #FD5A02;outline-offset:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}article{background:#202630;padding:16px;border-radius:12px}h2{font-size:1.1rem}video{width:100%;max-height:65vh;background:black}small{color:#b6c1d1}.note{border-left:3px solid #FD5A02;padding-left:14px}</style></head><body>
<h1>Revisión de cortos</h1><p class="note">Página local. Cambiar el estado no publica el video. Los videos nuevos aparecen en Revisión.</p>
<nav aria-label="Estados" id="tabs"></nav><p id="message" role="status">Cargando videos…</p><main id="videos"></main>
<script>
const states={revision:'Revisión',pruebas:'Pruebas',aprobados:'Aprobados',produccion:'Producción'};
let videos=[],selected='revision';const tabs=document.getElementById('tabs'),main=document.getElementById('videos'),msg=document.getElementById('message');
function paint(){tabs.replaceChildren();main.replaceChildren();for(const [id,label] of Object.entries(states)){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(id===selected));b.onclick=()=>{selected=id;paint();};tabs.append(b);}const shown=videos.filter(v=>v.state===selected);msg.textContent=shown.length+(shown.length===1?' video':' videos');for(const v of shown){const card=document.createElement('article'),h=document.createElement('h2'),video=document.createElement('video'),info=document.createElement('p'),link=document.createElement('a');h.textContent=v.title;video.controls=true;video.preload='none';video.src='media/'+encodeURIComponent(v.file);if(v.poster)video.poster='media/'+encodeURIComponent(v.poster);info.textContent=v.qa===true?'Control automático aprobado; revisar los cuadros.':v.qa===false?'Control automático fallido.':'Control automático pendiente.';link.textContent='Descargar MP4';link.href=video.src;link.download=v.file;card.append(h,video,info,link);main.append(card);}}
async function optional(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():{};}catch{return {};}}
(async()=>{const r=await fetch('listing/',{cache:'no-store'});if(!r.ok)throw Error('No se pudo leer la carpeta de videos');const files=await r.json(),status=await optional('media/status.json');videos=await Promise.all(files.filter(f=>f.type==='file'&&/^[a-z0-9][a-z0-9-]*\.mp4$/.test(f.name)).map(async f=>{const name=f.name.slice(0,-4),meta=await optional('media/'+name+'.json'),qa=await optional('media/'+name+'-qa.json'),saved=status[name];return {file:f.name,title:meta.title||name,poster:files.some(x=>x.name===name+'.jpg')?name+'.jpg':null,state:saved&&saved.video_hash===meta.video_hash&&states[saved.state]?saved.state:'revision',qa:qa.video_hash===meta.video_hash?qa.ok:undefined};}));paint();})().catch(e=>{msg.textContent=e.message;});
</script></body></html>
