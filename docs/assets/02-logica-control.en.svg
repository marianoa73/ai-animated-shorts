<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img"><title>02 · Audio check and correction</title><rect width="1400" height="950" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">02 · Audio check and correction</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Approval rests on the generated audio, not on the model&#x27;s promise</text><rect x="50" y="160" width="420" height="180" rx="16" fill="#202630" stroke="#FD5A02" stroke-width="3"/><text x="260.0" y="205.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Analyze WAV</text><text x="260.0" y="235.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">≥ 90 % of words + last word</text><text x="260.0" y="265.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">tail &lt; −45 dBFS / 150 ms</text><text x="260.0" y="295.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">peak &lt; −1 dBFS</text><rect x="50" y="390" width="420" height="170" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="260.0" y="430.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Check timing</text><text x="260.0" y="460.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">internal silence ≤ 0.6 s</text><text x="260.0" y="490.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">tail after last word ≤ 0.6 s</text><text x="260.0" y="520.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">pace 9–20 characters/s</text><polyline points="260,340 260,390" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="260,390 253.28804245954115,377.7138441335348 266.71195754045885,377.7138441335348" fill="#FD5A02"/><rect x="560" y="390" width="310" height="170" rx="16" fill="#202630" stroke="#FD5A02" stroke-width="3"/><text x="715.0" y="445.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">All checks pass?</text><text x="715.0" y="475.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Piper = fail</text><text x="715.0" y="505.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">no report = fail</text><polyline points="470,475 560,475" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="560,475 547.7138441335347,481.71195754045885 547.7138441335347,468.28804245954115" fill="#FD5A02"/><rect x="980" y="160" width="350" height="140" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1155.0" y="200.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Approve the line</text><text x="1155.0" y="230.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">store hash and report</text><text x="1155.0" y="260.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">reuse if nothing changed</text><polyline points="715,390 715,230 980,230" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="980,230 967.7138441335347,236.71195754045885 967.7138441335347,223.28804245954115" fill="#FD5A02"/><text x="760" y="205" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">Yes</text><rect x="980" y="390" width="350" height="170" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1155.0" y="445.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Increase seed</text><text x="1155.0" y="475.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">regenerate only the failed one</text><text x="1155.0" y="505.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">at most 5 retries</text><polyline points="870,475 980,475" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="980,475 967.7138441335347,481.71195754045885 967.7138441335347,468.28804245954115" fill="#FD5A02"/><text x="895" y="445" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">No</text><polyline points="1155,390 1155,350 500,350 500,250 470,250" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="470,250 482.2861558664652,243.28804245954115 482.2861558664652,256.71195754045885" fill="#FD5A02"/><rect x="820" y="690" width="510" height="140" rx="16" fill="#202630" stroke="#FD5A02" stroke-width="3"/><text x="1075.0" y="730.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">If it persists: human intervention</text><text x="1075.0" y="760.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">rewrite say, keep the caption</text><text x="1075.0" y="790.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">re-check before rendering</text><polyline points="1155,560 1155,690" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="1155,690 1148.2880424595412,677.7138441335347 1161.7119575404588,677.7138441335347" fill="#FD5A02"/><text x="50" y="875" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#EDF0F4">Final check: fuzzy LCS · no gaps &gt; 1 s · duration &gt; 30 s · volume · visual inspection.</text></svg>
