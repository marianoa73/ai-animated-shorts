<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img"><title>03 · Hardware y red privada</title><rect width="1400" height="840" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">03 · Hardware y red privada</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">La inferencia y el render no requieren servicios en la nube</text><rect x="50" y="180" width="630" height="360" rx="16" fill="#202630" stroke="#FD5A02" stroke-width="3"/><text x="365.0" y="285.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Mini PC · equipo de render</text><text x="365.0" y="315.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Intel i5 · 4 núcleos · 32 GB</text><text x="365.0" y="345.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Ubuntu 24.04 · Docker · CPU x86_64</text><text x="365.0" y="375.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Voces + imágenes + modelos + caché</text><text x="365.0" y="405.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Contenedores de trabajo sin red</text><text x="365.0" y="435.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Las muestras NO salen de este equipo</text><rect x="850" y="180" width="500" height="190" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1100.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Navegador de revisión</text><text x="1100.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">acceso local o por LAN privada</text><text x="1100.0" y="305.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sólo videos y metadatos de revisión</text><polyline points="680,275 850,275" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="850,275 837.7138441335347,281.71195754045885 837.7138441335347,268.28804245954115" fill="#FD5A02"/><text x="705" y="242" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">Salida</text><rect x="850" y="480" width="500" height="180" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1100.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Raspberry Pi opcional</text><text x="1100.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">4B · 8 GB · Debian</text><text x="1100.0" y="585.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sólo salida de revisión</text><text x="1100.0" y="615.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">proxy inverso HTTPS opcional</text><polyline points="680,480 760,480 760,570 850,570" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="850,570 837.7138441335347,576.7119575404588 837.7138441335347,563.2880424595412" fill="#FD5A02"/><polyline points="1100,480 1100,370" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="1100,370 1106.7119575404588,382.2861558664652 1093.2880424595412,382.2861558664652" fill="#FD5A02"/><text x="50" y="620" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#EDF0F4">LAN privada · sin direcciones ni equipos personales</text><text x="50" y="710" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#EDF0F4">Descargar dependencias y pesos ANTES de aportar muestras.</text><text x="50" y="755" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">El material generado contiene voz: compartirlo también requiere consentimiento.</text></svg>
