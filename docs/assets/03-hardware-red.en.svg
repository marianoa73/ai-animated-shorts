<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img"><title>03 · Hardware and private network</title><rect width="1400" height="840" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">03 · Hardware and private network</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Inference and rendering need no cloud services</text><rect x="50" y="180" width="630" height="360" rx="16" fill="#202630" stroke="#FD5A02" stroke-width="3"/><text x="365.0" y="285.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Mini PC · render machine</text><text x="365.0" y="315.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Intel i5 · 4 cores · 32 GB</text><text x="365.0" y="345.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Ubuntu 24.04 · Docker · x86_64 CPU</text><text x="365.0" y="375.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Voices + images + models + cache</text><text x="365.0" y="405.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Worker containers without network</text><text x="365.0" y="435.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Samples NEVER leave this machine</text><rect x="850" y="180" width="500" height="190" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1100.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Review browser</text><text x="1100.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">local or private-LAN access</text><text x="1100.0" y="305.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">only videos and review metadata</text><polyline points="680,275 850,275" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="850,275 837.7138441335347,281.71195754045885 837.7138441335347,268.28804245954115" fill="#FD5A02"/><text x="705" y="242" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">Output</text><rect x="850" y="480" width="500" height="180" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1100.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Optional Raspberry Pi</text><text x="1100.0" y="555.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">4B · 8 GB · Debian</text><text x="1100.0" y="585.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">review output only</text><text x="1100.0" y="615.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">optional HTTPS reverse proxy</text><polyline points="680,480 760,480 760,570 850,570" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="850,570 837.7138441335347,576.7119575404588 837.7138441335347,563.2880424595412" fill="#FD5A02"/><polyline points="1100,480 1100,370" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="1100,370 1106.7119575404588,382.2861558664652 1093.2880424595412,382.2861558664652" fill="#FD5A02"/><text x="50" y="620" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#EDF0F4">Private LAN · no personal addresses or machines</text><text x="50" y="710" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#EDF0F4">Download dependencies and weights BEFORE adding samples.</text><text x="50" y="755" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Generated material contains a voice: sharing it also requires consent.</text></svg>
