<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img"><title>01 · From script to review</title><rect width="1400" height="840" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">01 · From script to review</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Local processing · two configurable characters · publishing always manual</text><rect x="50" y="190" width="290" height="145" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="232.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Script</text><text x="195.0" y="262.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">text + say</text><text x="195.0" y="292.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">shot, gesture and seed</text><polyline points="340,262 385,262" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="385,262 372.7138441335348,268.71195754045885 372.7138441335348,255.28804245954115" fill="#FD5A02"/><rect x="385" y="190" width="290" height="145" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="232.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Voices + cache</text><text x="530.0" y="262.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Chatterbox CPU</text><text x="530.0" y="292.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">your own samples</text><polyline points="675,262 720,262" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="720,262 707.7138441335347,268.71195754045885 707.7138441335347,255.28804245954115" fill="#FD5A02"/><rect x="720" y="190" width="290" height="145" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="232.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Per-line check</text><text x="865.0" y="262.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">text, pace and signal</text><text x="865.0" y="292.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">up to 5 retries</text><polyline points="1010,262 1055,262" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="1055,262 1042.7138441335348,268.71195754045885 1042.7138441335348,255.28804245954115" fill="#FD5A02"/><rect x="1055" y="190" width="290" height="145" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="232.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">3D render</text><text x="1200.0" y="262.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">three.js + Chromium</text><text x="1200.0" y="292.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">30 frames per second</text><rect x="50" y="490" width="290" height="145" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="532.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Mix</text><text x="195.0" y="562.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">music + ducking</text><text x="195.0" y="592.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">cuts + −15 LUFS</text><polyline points="340,562 385,562" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="385,562 372.7138441335348,568.7119575404588 372.7138441335348,555.2880424595412" fill="#FD5A02"/><rect x="385" y="490" width="290" height="145" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="532.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Final check</text><text x="530.0" y="562.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">alignment and duration</text><text x="530.0" y="592.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">volume + 4 frames</text><polyline points="675,562 720,562" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="720,562 707.7138441335347,568.7119575404588 707.7138441335347,555.2880424595412" fill="#FD5A02"/><rect x="720" y="490" width="290" height="145" rx="16" fill="#202630" stroke="#FD5A02" stroke-width="3"/><text x="865.0" y="532.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Local review</text><text x="865.0" y="562.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">states in status.json</text><text x="865.0" y="592.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">a person decides</text><polyline points="1010,562 1055,562" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="1055,562 1042.7138441335348,568.7119575404588 1042.7138441335348,555.2880424595412" fill="#FD5A02"/><rect x="1055" y="490" width="290" height="145" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="532.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Manual publishing</text><text x="1200.0" y="562.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">outside the pipeline</text><text x="1200.0" y="592.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">rights confirmed</text><polyline points="1200,335 1200,410 195,410 195,490" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="195,490 188.28804245954115,477.7138441335348 201.71195754045885,477.7138441335348" fill="#FD5A02"/><polyline points="865,190 865,145 530,145 530,190" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="530,190 523.2880424595412,177.7138441335348 536.7119575404588,177.7138441335348" fill="#FD5A02"/><text x="50" y="750" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#EDF0F4">Any failure blocks approval; private samples are never served on the web.</text></svg>
